<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Kavya ❤️</title>
<style>
body{margin:0;min-height:100vh;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;font-family:Arial,sans-serif}
.heart{position:relative;width:170px;height:170px;background:#ff1744;transform:rotate(-45deg);animation:beat 1s infinite;box-shadow:0 0 35px #ff1744,0 0 80px rgba(255,23,68,.45)}
.heart:before,.heart:after{content:"";position:absolute;width:170px;height:170px;background:#ff1744;border-radius:50%}
.heart:before{top:-85px;left:0}.heart:after{top:0;left:85px}
@keyframes beat{0%,100%{transform:rotate(-45deg) scale(1)}50%{transform:rotate(-45deg) scale(1.08)}}
.message{margin-top:105px;color:white;text-align:center;font-size:clamp(20px,5vw,30px);font-weight:800;text-shadow:0 0 12px rgba(255,255,255,.5)}
.small{margin-top:14px;color:#ff9bb0;font-size:26px;letter-spacing:8px}
</style>
</head>
<body>
<div class="heart"></div>
<div class="message">I LOVE YOUUU SO MUCH KAVYA♥️💕</div>
<div class="small">♥ ♥ ♥</div>
</body>
</html>
